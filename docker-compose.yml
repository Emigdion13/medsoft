services:
  db:
    image: postgres:15-alpine
    container_name: medisoft_db
    environment:
      POSTGRES_DB: ${DB_NAME:-medisoft}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-medisoft}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - medisoft_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medisoft_backend
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - medisoft_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: medisoft_frontend_dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file:
      - .env.docker
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      - backend
    networks:
      - medisoft_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medisoft_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@medisoft.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - medisoft_network

volumes:
  postgres_data:

networks:
  medisoft_network:
    driver: bridge
