services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medisoft-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings_docker
      - DATABASE_URL=postgresql://medisoft:medisoft@db:5432/medisoft
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-me}
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend,medisoft-frontend,medisoft-backend
      - DJANGO_ADMIN_PASSWORD=admin
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - medisoft-network

  db:
    image: postgres:15-alpine
    container_name: medisoft-db
    environment:
      - POSTGRES_USER=medisoft
      - POSTGRES_PASSWORD=medisoft
      - POSTGRES_DB=medisoft
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medisoft"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - medisoft-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medisoft-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://medisoft-backend:8000/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - medisoft-network

  test-runner:
    build:
      context: ./test/e2e
      dockerfile: Dockerfile
    container_name: medisoft-test-runner
    working_dir: /app
    volumes:
      - ./test/e2e:/app
      - ./frontend:/app/frontend
    environment:
      - TEST_BASE_URL=http://medisoft-frontend:80
      - TEST_BACKEND_URL=http://medisoft-backend:8000
      - PLAYWRIGHT_HTML_REPORT=test-results/html
    depends_on:
      - frontend
      - backend
    networks:
      - medisoft-network

networks:
  medisoft-network:
    driver: bridge

volumes:
  postgres_data:
